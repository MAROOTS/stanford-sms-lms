services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: school_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  backend:
    build: ./schoolbackend
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/school_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: https://files.${DOMAIN}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      FRONTEND_URL: https://${DOMAIN}
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
    depends_on:
      - postgres
      - minio
    restart: unless-stopped

  caddy-ask:
    image: python:3.12-alpine
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        from urllib.parse import urlparse, parse_qs
        ROOT = "stanfordos.co.ke"
        class H(BaseHTTPRequestHandler):
            def do_GET(self):
                d = (parse_qs(urlparse(self.path).query).get("domain") or [""])[0].lower()
                ok = False
                if d.endswith("." + ROOT):
                    sub = d[: -(len(ROOT) + 1)]
                    ok = bool(sub) and "." not in sub and sub not in ("www", "files")
                self.send_response(200 if ok else 403)
                self.end_headers()
            def log_message(self, *a):
                pass
        HTTPServer(("0.0.0.0", 8090), H).serve_forever()
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./schoolfrontend/dist:/srv
        - ./stanfordos-website/out:/srv-www
      - caddy-data:/data
    depends_on:
      - backend
      - caddy-ask
    restart: unless-stopped

volumes:
  pg-data:
  minio-data:
  caddy-data: