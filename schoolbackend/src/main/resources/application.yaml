spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: schoolbackend
  datasource:
    url: jdbc:postgresql://localhost:5432/school_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
    refresh-expiration-remember-ms: 2592000000            # 30 days
    refresh-expiration-session-ms: 86400000
  platform-admin:
      email: ${PLATFORM_ADMIN_EMAIL:kademieugine@gmail.com}
      password: ${PLATFORM_ADMIN_PASSWORD:}
      first-name: ${PLATFORM_ADMIN_FIRST_NAME:Platform}
      last-name: ${PLATFORM_ADMIN_LAST_NAME:Administrator}
  admin:
    email: ${ADMIN_EMAIL:admin@admin.com}
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:School}
    last-name: ${ADMIN_LAST_NAME:Administrator}
  mail:
    from: ${GMAIL_USERNAME}
    sales-inbox: ${SALES_INBOX_EMAIL:${GMAIL_USERNAME}}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

library:
  default-loan-days: 14
  fine-per-day: 10.00
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
